[project]
name = "voiceready-kernel"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "voiceready-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voiceready_kernel"]

[tool.uv.sources]
voiceready-core = { workspace = true }
